name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, iou]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync code to deploy directory
        run: |
          set -euo pipefail
          rsync -a --chown=1000:1000 \
            --exclude 'backup/' \
            --exclude 'runners/' \
            --exclude 'node_modules/' \
            --exclude '.git/' \
            ./ /home/odoo/docker/IOU-Website/

      - name: Build and restart app only (no DB)
        working-directory: /home/odoo/docker/IOU-Website
        env:
          COMPOSE_PROJECT_NAME: iou-website
        run: |
          set -euo pipefail
          # Rebuild/restart application containers only.
          # --no-deps: do not recreate db, redis, or db-backup.
          # Never use: docker compose down -v, volume rm, or --force-recreate on db.
          docker compose up -d --build --no-deps backend frontend

      - name: Health check
        run: |
          set -euo pipefail
          # Runner is a container; host-published :3001 is not on its localhost.
          # Probe the app container via docker exec instead.
          for i in $(seq 1 45); do
            if docker exec iou-backend node -e "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend health check failed after deploy"
          docker logs --tail 80 iou-backend || true
          exit 1
